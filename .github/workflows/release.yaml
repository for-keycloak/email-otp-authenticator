name: 🚀 Release

on:
  # The release PR and the releases come from kidager-bot (GitHub App)
  release:
    types: [published]

permissions:
  # Uploads the JARs to the release
  contents: write
  # Cosign keyless signing
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    strategy:
      fail-fast: false
      matrix:
        keycloak_version:
          - keycloak-26.8.0
          - keycloak-26.7.5
          - keycloak-26.7.3
          - keycloak-26.6.4
          - keycloak-26.5.7
          - keycloak-26.4.7
          - keycloak-26.3.5
          - keycloak-26.2.5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: 'pom.xml'

      - name: build-keycloak-spi
        run: |
          mvn -B clean package \
            -P"${{ matrix.keycloak_version }}" \
            -D"buildVersion=$TAG"

      - id: jar-filepath-step
        run: echo "jar-filepath=$(find target -type f -name "*.jar" ! -name "original-*")" >> $GITHUB_OUTPUT

      - name: Validate JAR file path
        run: |
          if [ -z "${{ steps.jar-filepath-step.outputs.jar-filepath }}" ]; then
            echo "Error: JAR file not found."
            exit 1
          fi

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: cosign version

      - name: Sign JARs with Cosign
        run: |
          cosign sign-blob --yes ${{ steps.jar-filepath-step.outputs.jar-filepath }} \
            --bundle ${{ steps.jar-filepath-step.outputs.jar-filepath }}.bundle

      - name: Upload file to release
        run: |
          gh release upload "$TAG" ${{ steps.jar-filepath-step.outputs.jar-filepath }}
          gh release upload "$TAG" ${{ steps.jar-filepath-step.outputs.jar-filepath }}.bundle
        env:
          GH_TOKEN: ${{ github.TOKEN }}
